name: Deploy DEV to AWS S3

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply 25-year data to station pages (dev only)
        run: python3 build25/apply25.py

      - name: Update model statistics table in 3D pages (dev only)
        run: python3 build25/patch_stats.py

      - name: Inject drift panel into station pages (dev only)
        run: python3 drift/patch_pages.py

      - name: True-live gap fill for 3D pages (dev only)
        run: python3 build25/patch_live_gap.py

      - name: DACP confidence intervals for station pages (dev only)
        run: python3 build25/patch_dacp.py

      - name: Rebuild classic pages as statistics pages (dev only)
        run: python3 build25/patch_statsview.py
      - name: Soil & snow columns in the day panel (dev only)
        run: python3 build25/patch_soilsnow.py

      - name: UI fixes - legend band + movable/expandable panels (dev only)
        run: python3 build25/patch_uiux.py

      - name: Feature ablation RMSE readout fix (dev only)
        run: python3 build25/patch_ablfix.py

      - name: Weekly outlook - 12-week weekly mean flow panel (dev only)
        run: python3 build25/patch_weekly.py

      - name: 3D forecast chart in the Data view (dev only)
        run: python3 build25/patch_3dchart.py

      - name: Multi-factor correlation matrix in the Data view (dev only)
        run: python3 build25/patch_corr.py

      - name: Features affecting discharge flow - XGBoost importance (dev only)
        run: python3 build25/patch_featimp.py

      - name: Model full forms in the Data view (dev only)
        run: python3 build25/patch_fullforms.py

      - name: Station clusters in the Data view (dev only)
        run: python3 build25/patch_clusters.py

      - name: Basin info on the homepage map-pin hover card (dev only)
        run: python3 build25/patch_mapbasin.py

      - name: Monthly outlook - next 6 monthly mean flows panel (dev only)
        run: python3 build25/patch_monthly.py

      - name: Live-mode stall fix - per-stage timeouts (dev only)
        run: python3 build25/patch_livefix.py

      - name: Weekly + monthly model compare panels (dev only)
        run: python3 build25/patch_compare_wm.py

      - name: Monthly outlook - Flow & forecast panel treatment (dev only)
        run: python3 build25/patch_ffmonthly.py

      - name: Yearly outlook - next 12 x 30-day mean flows panel (dev only)
        run: python3 build25/patch_yearly.py

      - name: Yearly model compare panel (dev only)
        run: python3 build25/patch_compare_y.py

      - name: Cache-busting build stamp (dev only)
        env:
          HT_BUILD_ID: ${{ github.run_id }}-${{ github.sha }}
        run: python3 build25/patch_cachebust.py

      - name: One Live action for all charts + old-weights series (dev)
        run: python3 build25/patch_liveall.py

      - name: Remove climatology from the station-page UI (dev)
        run: python3 build25/patch_noclim.py

      - name: Remove login gate from every page (dev only)
        run: python3 build25/patch_auth.py

      - name: Panels load on click only (dev only)
        run: python3 build25/patch_lazy_panels.py

      - name: River continuity + no buildings in water (dev only)
        run: python3 build25/patch_riverwater.py

      - name: Smoother rendering + realistic water (dev only)
        run: python3 build25/patch_smooth.py

      - name: No dotted river overlay + visible water surface (dev only)
        run: python3 build25/patch_flowline.py

      - name: Baked water polygons for the out-of-block river (dev only)
        run: python3 build25/patch_polywater.py
      - name: Real river from USGS 3DEP elevation (dev only)
        run: python3 build25/patch_realriver.py
      - name: No buildings - 3D buildings layer removed entirely (dev only)
        run: python3 build25/patch_nobuildings.py

      - name: Ribbon shading fix - water normals up, double-sided (dev only)
        run: python3 build25/patch_ribbonshade.py

      - name: Water under bridges - ribbon gaps at OSM bridge crossings (dev only)
        run: python3 build25/patch_bridgegap.py

      - name: Water under bridges - polygon water gaps at the same crossings (dev only)
        run: python3 build25/patch_polygap.py

      - name: Dallas polygon water rebuilt from USGS 3DHP (dev only)
        run: python3 build25/patch_3dhp_dallas.py stations

      - name: All-stations polygon water rebuilt from USGS 3DHP (dev only)
        run: python3 build25/patch_3dhp_all.py stations

      - name: Realism - per-station terrain exaggeration + hillshade blend (dev only)
        run: python3 build25/patch_realism_terrain.py

      - name: Realism - flow-aligned animated water shader (dev only)
        run: python3 build25/patch_realism_flowwater.py

      - name: Realism - 3D staff gauge + flood extent overlay (dev only)
        run: python3 build25/patch_realism_gauge.py

      - name: Realism - NLCD instanced trees + USACE levees (dev only)
        run: python3 build25/patch_realism_context.py

      - name: Keyboard shortcuts must not steal typing from form fields (dev only)
        run: python3 build25/patch_keyfix.py

      - name: Generate helper-bot site index (dev only)
        run: python3 build25/gen_helper_index.py

      - name: Generate helper-bot entry embeddings (dev only)
        run: |
          mkdir -p /tmp/llama-emb
          curl -fL --retry 3 -o /tmp/llama-emb/llama.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/b12032/llama-b12032-bin-ubuntu-x64.tar.gz
          tar -xzf /tmp/llama-emb/llama.tar.gz -C /tmp/llama-emb
          curl -fL --retry 3 -o /tmp/llama-emb/bge-small-en-v1.5-q8_0.gguf https://huggingface.co/ggml-org/bge-small-en-v1.5-Q8_0-GGUF/resolve/main/bge-small-en-v1.5-q8_0.gguf
          HT_LLAMA_SERVER=/tmp/llama-emb/llama-b12032/llama-server HT_EMBED_MODEL=/tmp/llama-emb/bge-small-en-v1.5-q8_0.gguf python3 build25/gen_helper_embeddings.py

      - name: Helper bot widget on all pages (dev only)
        run: python3 build25/patch_helperbot.py

      - name: Rain/snow animation by selected date (dev only)
        run: python3 build25/patch_precip.py

      - name: Data view charts in 3D (dev only)
        run: python3 build25/patch_charts3d.py

      - name: Commit baked pages back to dev (best effort)
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain stations index.html mlops.html helper)" ]; then
            git config user.name "hydrotwin-dev"
            git config user.email "actions@github.com"
            git add stations index.html mlops.html helper
            git commit -m "Bake station pages (dev)"
            git push
          else
            echo "Pages already baked; nothing to commit."
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync site to DEV S3 bucket
        run: |
          aws s3 sync . s3://hydrotwin-site-dev-2026/ \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "build25/*" \
            --exclude "data/pulls/*" \
            --delete

      - name: HTML cache headers on DEV bucket (dev only)
        run: |
          aws s3 cp . s3://hydrotwin-site-dev-2026/ --recursive \
            --exclude "*" --include "index.html" --include "stations/*.html" \
            --cache-control "no-cache" --content-type "text/html"

      - name: Invalidate DEV CloudFront cache (dev only)
        run: |
          INV_ID=$(aws cloudfront create-invalidation \
            --distribution-id EW9JZR3H96ARN \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "CloudFront invalidation submitted: $INV_ID"
          aws cloudfront wait invalidation-completed \
            --distribution-id EW9JZR3H96ARN --id "$INV_ID"
          echo "CloudFront invalidation $INV_ID completed."
