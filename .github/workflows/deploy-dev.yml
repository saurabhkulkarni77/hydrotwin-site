name: Deploy DEV to AWS S3

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply 25-year data to station pages (dev only)
        run: python3 build25/apply25.py

      - name: Update model statistics table in 3D pages (dev only)
        run: python3 build25/patch_stats.py

      - name: Inject drift panel into station pages (dev only)
        run: python3 drift/patch_pages.py

      - name: True-live gap fill for 3D pages (dev only)
        run: python3 build25/patch_live_gap.py

      - name: DACP confidence intervals for station pages (dev only)
        run: python3 build25/patch_dacp.py

      - name: Rebuild classic pages as statistics pages (dev only)
        run: python3 build25/patch_statsview.py
      - name: Soil & snow columns in the day panel (dev only)
        run: python3 build25/patch_soilsnow.py

      - name: UI fixes - legend band + movable/expandable panels (dev only)
        run: python3 build25/patch_uiux.py

      - name: Feature ablation RMSE readout fix (dev only)
        run: python3 build25/patch_ablfix.py

      - name: Weekly outlook - 12-week weekly mean flow panel (dev only)
        run: python3 build25/patch_weekly.py

      - name: 3D forecast chart in the Data view (dev only)
        run: python3 build25/patch_3dchart.py

      - name: Multi-factor correlation matrix in the Data view (dev only)
        run: python3 build25/patch_corr.py

      - name: Model full forms in the Data view (dev only)
        run: python3 build25/patch_fullforms.py

      - name: Station clusters in the Data view (dev only)
        run: python3 build25/patch_clusters.py

      - name: Basin info on the homepage map-pin hover card (dev only)
        run: python3 build25/patch_mapbasin.py

      - name: Monthly outlook - next 6 monthly mean flows panel (dev only)
        run: python3 build25/patch_monthly.py

      - name: Live-mode stall fix - per-stage timeouts (dev only)
        run: python3 build25/patch_livefix.py

      - name: Weekly + monthly model compare panels (dev only)
        run: python3 build25/patch_compare_wm.py

      - name: Monthly outlook - Flow & forecast panel treatment (dev only)
        run: python3 build25/patch_ffmonthly.py

      - name: Yearly outlook - next 12 x 30-day mean flows panel (dev only)
        run: python3 build25/patch_yearly.py

      - name: Yearly model compare panel (dev only)
        run: python3 build25/patch_compare_y.py

      - name: Cache-busting build stamp (dev only)
        env:
          HT_BUILD_ID: ${{ github.run_id }}-${{ github.sha }}
        run: python3 build25/patch_cachebust.py

      - name: One Live action for all charts + old-weights series (dev)
        run: python3 build25/patch_liveall.py

      - name: Remove climatology from the station-page UI (dev)
        run: python3 build25/patch_noclim.py

      - name: Remove login gate from every page (dev only)
        run: python3 build25/patch_auth.py

      - name: Panels load on click only (dev only)
        run: python3 build25/patch_lazy_panels.py

      - name: Commit baked pages back to dev (best effort)
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain stations index.html mlops.html)" ]; then
            git config user.name "hydrotwin-dev"
            git config user.email "actions@github.com"
            git add stations index.html mlops.html
            git commit -m "Bake station pages (dev)"
            git push
          else
            echo "Pages already baked; nothing to commit."
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync site to DEV S3 bucket
        run: |
          aws s3 sync . s3://hydrotwin-site-dev-2026/ \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "build25/*" \
            --delete

      - name: HTML cache headers on DEV bucket (dev only)
        run: |
          aws s3 cp . s3://hydrotwin-site-dev-2026/ --recursive \
            --exclude "*" --include "index.html" --include "stations/*.html" \
            --cache-control "no-cache" --content-type "text/html"

      - name: Invalidate DEV CloudFront cache (dev only)
        run: |
          INV_ID=$(aws cloudfront create-invalidation \
            --distribution-id EW9JZR3H96ARN \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "CloudFront invalidation submitted: $INV_ID"
          aws cloudfront wait invalidation-completed \
            --distribution-id EW9JZR3H96ARN --id "$INV_ID"
          echo "CloudFront invalidation $INV_ID completed."
