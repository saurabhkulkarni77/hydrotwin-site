name: Deploy HydroTwin MERGED (river + energy) to AWS S3 + CloudFront — v2 weekly live refresh + retrain

# v2 of deploy-hydrotwin-merged-aws.yml (v1 stays as the manual-only
# fallback; this file supersedes it for scheduled runs). Same merged build
# and same deploy target — its OWN dedicated bucket (hydrotwin-merged-2026)
# fronted by its OWN CloudFront distribution, using this repo's AWS secrets.
# It does NOT touch the HydroTwin prod/dev sites, their buckets or
# distributions, the HydroTwin Energy site, or any other project site.
#
# What v2 adds, mirroring the river twin's own automation (daily
# pull-snapshots.yml data pulls + weekly monitor.yml cadence):
#   1. A WEEKLY schedule (Mondays 09:17 UTC, the river monitor's slot) in
#      addition to manual dispatch.
#   2. A live data-refresh step BEFORE the build: the energy pipeline's own
#      fetch functions re-pull every energy feed (EIA ICE prices, Henry Hub
#      gas, CAISO OASIS, USGS flows, NRCS SNOTEL/SCAN, Open-Meteo — all
#      public, no API keys) into the energy workspace. Per feed, a failed
#      or implausible fetch falls back to the bundled cached data with a
#      named warning; the build still succeeds.
#   3. The energy snapshot (site/data.js) is regenerated by running the
#      energy pipeline itself on the refreshed cache, so the pages'
#      headline forecasts and holdout metrics move with the fresh data.
#   4. The build step then RETRAINS everything else (daily + weekly +
#      monthly models and the day-regime clusters) from the same refreshed
#      data — that retrain is what gen_energy_extra.py already does on
#      every run — and the result is redeployed to the merged
#      bucket/distribution only.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Mondays 09:17 UTC — same slot as the river twin's weekly
    # MLOps monitor (monitor.yml). GitHub rule: the schedule activates
    # only while this file is on the repo's default branch.
    - cron: "17 9 * * 1"

permissions:
  contents: read

env:
  AWS_PAGER: ""
  BUCKET: hydrotwin-merged-2026
  AWS_REGION: us-east-1
  ORIGIN_DOMAIN: hydrotwin-merged-2026.s3-website-us-east-1.amazonaws.com
  PROD_DIST_ID: E29IVO4IMQNKO6

jobs:
  deploy-merged-twin:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out build scripts, river source and energy workspace
        run: |
          git clone --depth 1 https://github.com/saurabhkulkarni77/hydrotwin-merged.git work
          git clone --depth 1 https://github.com/saurabhkulkarni77/hydrotwin-site.git river
          git clone --depth 1 https://github.com/saurabhkulkarni77/hydrotwin-energy.git energy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies
        run: |
          pip install numpy pandas scikit-learn requests openpyxl xlrd statsmodels sktime
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Refresh energy data (live pull; per-feed fallback to bundled cache)
        env:
          HTE_WS: ${{ github.workspace }}/energy
          MERGED_ROOT: ${{ github.workspace }}/work
        run: |
          # Re-pulls every energy feed with the pipeline's own fetchers
          # (work/build/refresh_energy_data.py, from the hydrotwin-merged
          # repo). Exits 0 even when some feeds fall back to cache; each
          # fallback is echoed as a ::warning naming the feed. The CAISO
          # OASIS re-pull (chunked, ~4 years of day-ahead LMP) is the slow
          # part — the job timeout below already allows for it.
          python work/build/refresh_energy_data.py

      - name: Regenerate energy snapshot from the refreshed data (pipeline retrain)
        run: |
          # Runs the energy pipeline end-to-end inside the cloned energy
          # workspace: its fetchers reuse the just-refreshed raw cache
          # (they only download files that are missing), it retrains the
          # shipped per-horizon models, and it rewrites energy/site/data.js
          # + energy/data/metrics.json with today's snapshot date. The
          # merged build below then sanity-checks its own retrain against
          # THIS snapshot's metrics.
          python energy/pipeline/pipeline.py

      - name: Build merged site (retrain all energy models on the refreshed data + site assembly)
        env:
          HTE_WS: ${{ github.workspace }}/energy
          MERGED_RIVER_SRC: ${{ github.workspace }}/river
          MERGED_ROOT: ${{ github.workspace }}/work
        run: |
          python work/build/gen_energy_extra.py
          python work/build/build_site.py
          ls work/site/energy
          grep -c "Energy price regions" work/site/index.html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Ensure website bucket exists
        run: |
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION"
          fi
          aws s3api put-public-access-block --bucket "$BUCKET" \
            --public-access-block-configuration \
            BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false
          aws s3api put-bucket-website --bucket "$BUCKET" \
            --website-configuration '{"IndexDocument":{"Suffix":"index.html"},"ErrorDocument":{"Key":"index.html"}}'
          cat > /tmp/policy.json <<EOF
          {"Version":"2012-10-17","Statement":[{"Sid":"PublicRead","Effect":"Allow",
            "Principal":"*","Action":"s3:GetObject",
            "Resource":"arn:aws:s3:::$BUCKET/*"}]}
          EOF
          aws s3api put-bucket-policy --bucket "$BUCKET" --policy file:///tmp/policy.json

      - name: Sync merged site to S3
        run: |
          aws s3 sync work/site "s3://$BUCKET/" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --delete
          aws s3 ls "s3://$BUCKET/" --recursive | head -50

      - name: Check for an existing merged distribution
        run: |
          aws cloudfront list-distributions > dists.json
          python3 - <<'PYEOF'
          import json, os
          d = json.load(open('dists.json'))
          items = d.get('DistributionList', {}).get('Items', []) or []
          found = None
          for it in items:
              for o in it.get('Origins', {}).get('Items', []):
                  if o.get('DomainName') == 'hydrotwin-merged-2026.s3-website-us-east-1.amazonaws.com':
                      found = it
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              if found:
                  f.write(f"DIST_ID={found['Id']}\nDIST_DOMAIN={found['DomainName']}\n")
                  print('Found existing distribution:', found['Id'], found['DomainName'], found['Status'])
              else:
                  print('No existing distribution found; will create one.')
          PYEOF

      - name: Build distribution config from prod config
        if: env.DIST_ID == ''
        run: |
          aws cloudfront get-distribution-config --id "$PROD_DIST_ID" > prod_full.json
          python3 - <<'PYEOF'
          import json, time
          cfg = json.load(open('prod_full.json'))['DistributionConfig']
          cfg['CallerReference'] = f'hydrotwin-merged-{int(time.time())}'
          cfg['Comment'] = 'HydroTwin MERGED site (river + energy) - HTTPS front for hydrotwin-merged-2026 website endpoint'
          origins = cfg['Origins']
          o = origins['Items'][0]
          old_id = o.get('Id')
          new_id = 'S3-Website-hydrotwin-merged-2026'
          o['Id'] = new_id
          o['DomainName'] = 'hydrotwin-merged-2026.s3-website-us-east-1.amazonaws.com'
          o['OriginPath'] = ''
          o.pop('S3OriginConfig', None)
          coc = o.get('CustomOriginConfig', {})
          coc['HTTPPort'] = 80
          coc['HTTPSPort'] = 443
          coc['OriginProtocolPolicy'] = 'http-only'
          coc['OriginSslProtocols'] = {'Quantity': 1, 'Items': ['TLSv1.2']}
          coc.setdefault('OriginReadTimeout', 30)
          coc.setdefault('OriginKeepaliveTimeout', 5)
          o['CustomOriginConfig'] = coc
          o['ConnectionAttempts'] = o.get('ConnectionAttempts', 3)
          o['ConnectionTimeout'] = o.get('ConnectionTimeout', 10)
          o['OriginShield'] = {'Enabled': False}
          origins['Quantity'] = 1
          origins['Items'] = [o]
          dcb = cfg['DefaultCacheBehavior']
          dcb['TargetOriginId'] = new_id
          cfg['DefaultCacheBehavior'] = dcb
          cb = cfg.get('CacheBehaviors') or {'Quantity': 0, 'Items': []}
          for item in cb.get('Items', []) or []:
              if item.get('TargetOriginId') == old_id:
                  item['TargetOriginId'] = new_id
          cfg['CacheBehaviors'] = cb
          cfg['Aliases'] = {'Quantity': 0, 'Items': []}
          cfg['DefaultRootObject'] = 'index.html'
          cfg['Enabled'] = True
          cfg['ViewerCertificate'] = {'CloudFrontDefaultCertificate': True}
          cfg['Logging'] = {'Enabled': False, 'IncludeCookies': False, 'Bucket': '', 'Prefix': ''}
          cfg['WebACLId'] = ''
          cfg['IsIPV6Enabled'] = cfg.get('IsIPV6Enabled', True)
          json.dump(cfg, open('dt_dc.json', 'w'), indent=1)
          print('origin:', o['DomainName'])
          PYEOF

      - name: Create distribution
        if: env.DIST_ID == ''
        run: |
          aws cloudfront create-distribution --distribution-config file://dt_dc.json > created.json
          python3 - <<'PYEOF'
          import json, os
          d = json.load(open('created.json'))['Distribution']
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"DIST_ID={d['Id']}\nDIST_DOMAIN={d['DomainName']}\n")
          print('Created:', d['Id'], d['DomainName'], d['Status'])
          PYEOF

      - name: Invalidate cache
        run: |
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" || true

      - name: Wait for deployment
        run: |
          for i in $(seq 1 45); do
            STATUS=$(aws cloudfront get-distribution --id "$DIST_ID" --query 'Distribution.Status' --output text)
            echo "check $i: $STATUS"
            if [ "$STATUS" = "Deployed" ]; then break; fi
            sleep 60
          done
          echo "final status: $STATUS"

      - name: Verify origin and distribution serve the merged site
        run: |
          for p in index.html energy/index.html energy/palo.html stations/USGS-01463500.html; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://$BUCKET.s3-website-$AWS_REGION.amazonaws.com/$p")
            echo "origin $p -> HTTP $code"
          done
          curl -s "https://$DIST_DOMAIN/index.html" | grep -c "Energy price regions" || true
          curl -s "https://$DIST_DOMAIN/energy/np15.html" | grep -c "CAISO NP15" || true

      - name: Publish result
        run: |
          {
            echo "## HydroTwin MERGED on AWS"
            echo "- Bucket: $BUCKET (us-east-1)"
            echo "- Distribution ID: $DIST_ID"
            echo "- Domain: $DIST_DOMAIN"
            echo "- HTTPS base: https://$DIST_DOMAIN"
            echo "RESULT_JSON {\"bucket\":\"$BUCKET\",\"distribution_id\":\"$DIST_ID\",\"domain\":\"$DIST_DOMAIN\",\"https_base\":\"https://$DIST_DOMAIN\"}"
          } | tee result.txt
          cat result.txt >> "$GITHUB_STEP_SUMMARY"
