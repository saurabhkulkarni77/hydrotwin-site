name: Deploy NPP Digital Twin (E1-E5 core notebook) to AWS S3

# Manual-only helper workflow. Deploys the public
# saurabhkulkarni77/npp-digital-twin-e1e5 repo to its own AWS S3 website
# bucket using this repo's AWS secrets (same names/conventions as
# deploy-aws.yml / deploy-npp-twin.yml / deploy-npp-twin-hw2.yml). It does
# NOT touch the HydroTwin site, its bucket, the other NPP twins, or their
# deploy behavior.

on:
  workflow_dispatch:

jobs:
  deploy-npp-twin-e1e5:
    runs-on: ubuntu-latest
    env:
      BUCKET: npp-digital-twin-e1e5-2026
      AWS_REGION: us-east-1
    steps:
      - name: Check out NPP Digital Twin E1-E5 repo
        run: git clone --depth 1 https://github.com/saurabhkulkarni77/npp-digital-twin-e1e5.git npp-twin-e1e5-src

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Ensure website bucket exists
        run: |
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION"
          fi
          aws s3api put-public-access-block --bucket "$BUCKET" \
            --public-access-block-configuration \
            BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false
          aws s3api put-bucket-website --bucket "$BUCKET" \
            --website-configuration '{"IndexDocument":{"Suffix":"index.html"},"ErrorDocument":{"Key":"index.html"}}'
          cat > /tmp/policy.json <<EOF
          {"Version":"2012-10-17","Statement":[{"Sid":"PublicRead","Effect":"Allow",
            "Principal":"*","Action":"s3:GetObject",
            "Resource":"arn:aws:s3:::$BUCKET/*"}]}
          EOF
          aws s3api put-bucket-policy --bucket "$BUCKET" --policy file:///tmp/policy.json

      - name: Sync twin site to S3
        run: |
          aws s3 sync npp-twin-e1e5-src "s3://$BUCKET/" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --delete

      - name: Publish URL
        run: |
          echo "### NPP Digital Twin (E1-E5 core notebook) on AWS" >> "$GITHUB_STEP_SUMMARY"
          echo "http://$BUCKET.s3-website-$AWS_REGION.amazonaws.com" >> "$GITHUB_STEP_SUMMARY"
