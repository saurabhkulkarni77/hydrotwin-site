name: MLOps monitor — drift & freshness

# Weekly (and on demand): recompute drift/freshness/coverage checks
# from this repo's baked drift data + sidecars. On any threshold
# breach, open (or update, via comment) a single tracking issue
# labelled `mlops-monitor`. Silent success otherwise — the report is
# still attached as a run artifact and step summary.

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run monitor checks
        id: mon
        run: python monitor/monitor.py --report monitor_report.md
      - name: Publish report to step summary
        if: always()
        run: cat monitor_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-report
          path: monitor_report.md
      - name: Open or update tracking issue on breach
        if: steps.mon.outputs.breach == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('monitor_report.md', 'utf8');
            const label = 'mlops-monitor';
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: label, color: 'b60205',
                description: 'MLOps monitoring findings (drift/freshness)',
              });
            } catch (e) { /* label already exists */ }
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label,
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
              core.info(`Updated tracking issue #${open.data[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'MLOps monitor: drift threshold breaches detected',
                body, labels: [label],
              });
              core.info(`Created tracking issue #${created.data.number}`);
            }
