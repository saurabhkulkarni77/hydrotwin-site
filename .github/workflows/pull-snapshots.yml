name: Pull fresh data snapshots to DEV S3

# ht-pullfwd v1 companion: pull the same fresh series the station
# pages' LIVE pull fetches (USGS daily values + Open-Meteo weather,
# scripts/pull_snapshots.py) for all 14 stations and publish them to
# the DEV bucket as data/pulls/<station>/<pull-date>.json plus
# data/pulls/manifest.json. The station pages read the manifest on
# load and forward their calendar to the newest pulled date
# (build25/patch_liveall.py, ht-pullfwd v1). DEV ONLY — this workflow
# never touches the production bucket or the main branch.
#
# Trigger note (GitHub rule): schedule and workflow_dispatch only
# activate when the workflow file exists on the repo's DEFAULT branch.
# This file lives on dev (dev-only scope), so until it is also copied
# to main the daily cron below and the Run-workflow button are inert;
# the push trigger on dev is what runs it today (any dev push touching
# the workflow, the script, or data/pulls/.trigger).

on:
  workflow_dispatch:
  schedule:
    # Daily 12:17 UTC (~7:17 AM CT): after USGS has published most
    # stations' daily means for yesterday.
    - cron: "17 12 * * *"
  push:
    branches: [dev]
    paths:
      - ".github/workflows/pull-snapshots.yml"
      - "scripts/pull_snapshots.py"
      - "data/pulls/.trigger"

permissions:
  contents: read

concurrency:
  group: pull-snapshots-dev
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull fresh series for all 14 stations
        run: python3 scripts/pull_snapshots.py --out pull_out --s3-prefix data/pulls

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload snapshots + manifest to the DEV bucket
        run: |
          DATE=$(date -u +%F)
          for f in pull_out/stations/*.json; do
            sid=$(basename "$f" .json)
            aws s3 cp "$f" "s3://hydrotwin-site-dev-2026/data/pulls/$sid/$DATE.json" \
              --content-type "application/json" --cache-control "no-cache"
          done
          aws s3 cp pull_out/manifest.json \
            "s3://hydrotwin-site-dev-2026/data/pulls/manifest.json" \
            --content-type "application/json" --cache-control "no-cache"
          echo "Uploaded snapshots for $DATE and data/pulls/manifest.json"

      - name: Show manifest + one snapshot (run evidence)
        run: |
          echo "----- manifest.json -----"
          cat pull_out/manifest.json
          echo "----- data/pulls/08057000 snapshot (head) -----"
          head -c 1200 pull_out/stations/08057000.json; echo
          echo "----- DEV bucket data/pulls/ listing -----"
          aws s3 ls s3://hydrotwin-site-dev-2026/data/pulls/ --recursive | head -40
