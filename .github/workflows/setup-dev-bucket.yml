name: Setup dev bucket (one-time)

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Create and configure dev bucket
        run: |
          set -e
          BUCKET=hydrotwin-site-dev-2026
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket already exists"
          else
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1
          fi
          aws s3api put-public-access-block --bucket "$BUCKET" \
            --public-access-block-configuration BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false
          cat > /tmp/policy.json <<'JSON'
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Sid": "PublicReadGetObject",
              "Effect": "Allow",
              "Principal": "*",
              "Action": "s3:GetObject",
              "Resource": "arn:aws:s3:::hydrotwin-site-dev-2026/*"
            }]
          }
          JSON
          aws s3api put-bucket-policy --bucket "$BUCKET" --policy file:///tmp/policy.json
          aws s3api put-bucket-website --bucket "$BUCKET" \
            --website-configuration '{"IndexDocument":{"Suffix":"index.html"},"ErrorDocument":{"Key":"index.html"}}'
          echo "Dev bucket ready: http://hydrotwin-site-dev-2026.s3-website-us-east-1.amazonaws.com"
