name: Setup helper-bot Lambda (one-off)

# One-off infra for the HydroTwin helper bot server-side model:
# private S3 bucket holds the model GGUF (Meta Llama-3.2-3B-Instruct
# since 2026-11-03, served by a persistent llama-server per Lambda
# environment; the Qwen2.5-3B, Qwen3-4B and Qwen2.5-0.5B files stay
# in the bucket for rollback); a Lambda
# (python3.12 zip deployment, bundled llama.cpp built for Amazon
# Linux 2023) serves grounded answers through a Function URL whose
# CORS is restricted to the DEV CloudFront origin only.
# Manual dispatch, plus a push trigger on its own infra files (a
# workflow_dispatch-only file cannot be dispatched while it exists
# only on this branch; the push trigger is how it runs. All steps
# are idempotent, so a re-run is safe.)

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/setup-helper-lambda.yml'
      - 'build25/helper_lambda/**'

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  BUCKET: hydrotwin-helper-2026
  MODEL_FILE: Llama-3.2-3B-Instruct-Q4_K_M.gguf
  MODEL_URL: https://huggingface.co/bartowski/Llama-3.2-3B-Instruct-GGUF/resolve/main/Llama-3.2-3B-Instruct-Q4_K_M.gguf
  EMBED_MODEL_FILE: bge-small-en-v1.5-q8_0.gguf
  EMBED_MODEL_URL: https://huggingface.co/ggml-org/bge-small-en-v1.5-Q8_0-GGUF/resolve/main/bge-small-en-v1.5-q8_0.gguf
  ROLE_NAME: hydrotwin-helper-lambda-role
  FUNCTION_NAME: hydrotwin-helper
  DEV_ORIGIN: https://d36737oy6jvpd8.cloudfront.net

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Who am I
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Create private model bucket (if missing)
        run: |
          set -euo pipefail
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket $BUCKET already exists."
          else
            aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION"
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
            echo "Bucket $BUCKET created and blocked from public access."
          fi

      - name: Upload model to bucket (if missing)
        run: |
          set -euo pipefail
          if aws s3api head-object --bucket "$BUCKET" --key "model/$MODEL_FILE" 2>/dev/null; then
            echo "Model already in bucket."
          else
            curl -fL --retry 3 -o "$MODEL_FILE" "$MODEL_URL"
            ls -l "$MODEL_FILE"
            aws s3 cp "$MODEL_FILE" "s3://$BUCKET/model/$MODEL_FILE"
            echo "Model uploaded."
          fi

      - name: Upload embedding model to bucket (if missing)
        run: |
          set -euo pipefail
          if aws s3api head-object --bucket "$BUCKET" --key "model/$EMBED_MODEL_FILE" 2>/dev/null; then
            echo "Embedding model already in bucket."
          else
            curl -fL --retry 3 -o "$EMBED_MODEL_FILE" "$EMBED_MODEL_URL"
            ls -l "$EMBED_MODEL_FILE"
            aws s3 cp "$EMBED_MODEL_FILE" "s3://$BUCKET/model/$EMBED_MODEL_FILE"
            echo "Embedding model uploaded."
          fi

      - name: Create Lambda execution role (if missing)
        run: |
          set -euo pipefail
          if aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
            echo "Role $ROLE_NAME already exists."
          else
            aws iam create-role --role-name "$ROLE_NAME" \
              --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"lambda.amazonaws.com"},"Action":"sts:AssumeRole"}]}'
            echo "Role created; waiting for propagation."
            sleep 15
          fi
          aws iam attach-role-policy --role-name "$ROLE_NAME" \
            --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
          aws iam put-role-policy --role-name "$ROLE_NAME" \
            --policy-name hydrotwin-helper-s3-read \
            --policy-document "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\"],\"Resource\":\"arn:aws:s3:::$BUCKET/*\"}]}"
          echo "Role policies in place."

      - name: Build llama.cpp for Amazon Linux 2023
        run: |
          set -euo pipefail
          cp "$MODEL_FILE" model.gguf 2>/dev/null || curl -fL --retry 3 -o model.gguf "$MODEL_URL"
          docker run --rm -v "$GITHUB_WORKSPACE":/work -w /work \
            public.ecr.aws/amazonlinux/amazonlinux:2023 bash -euxc '
              dnf install -y gcc gcc-c++ cmake git make tar gzip >/dev/null
              git clone --depth 1 --branch b12020 https://github.com/ggml-org/llama.cpp src
              cmake -S src -B build -DCMAKE_BUILD_TYPE=Release \
                -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF \
                -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF
              cmake --build build --target llama-completion llama-server -j"$(nproc)"
              mkdir -p pkg/llama
              cp build/bin/llama-completion build/bin/llama-server pkg/llama/
              find build -name "*.so*" -exec cp -a {} pkg/llama/ \;
              ls -la pkg/llama
              export LD_LIBRARY_PATH=/work/pkg/llama
              PROMPT=$(printf "<|begin_of_text|><|start_header_id|>system<|end_header_id|>\n\nYou answer questions about locating information in a hydrology digital twin. Be brief.<|eot_id|><|start_header_id|>user<|end_header_id|>\n\nQuestion: Where is the hydrograph for Dallas?<|eot_id|><|start_header_id|>assistant<|end_header_id|>\n\n")
              /work/pkg/llama/llama-completion -m /work/model.gguf \
                -p "$PROMPT" -n 48 -c 2048 -t 2 --temp 0.2 --seed 42 \
                --no-display-prompt -r "<|eot_id|>" > smoke_out.txt 2> smoke_err.txt || true
              echo "--- llama-completion smoke stdout ---"
              cat smoke_out.txt
              test -s smoke_out.txt
            '
          echo "llama.cpp built and smoke-tested inside Amazon Linux 2023."

      - name: Package and upload deployment zip
        run: |
          set -euo pipefail
          mkdir -p pkgroot
          cp build25/helper_lambda/handler.py pkgroot/handler.py
          cp -a pkg/llama pkgroot/llama
          (cd pkgroot && zip -qr ../helper-fn.zip .)
          unzip -l helper-fn.zip
          aws s3 cp helper-fn.zip "s3://$BUCKET/deploy/helper-fn.zip"
          echo "Deployment zip uploaded."

      - name: Create or update the Lambda function
        run: |
          set -euo pipefail
          ROLE_ARN=$(aws iam get-role --role-name "$ROLE_NAME" --query 'Role.Arn' --output text)
          echo "Role ARN: $ROLE_ARN"
          if aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            echo "Function exists; updating code and configuration."
            aws lambda update-function-code --function-name "$FUNCTION_NAME" \
              --s3-bucket "$BUCKET" --s3-key deploy/helper-fn.zip >/dev/null
            echo "Settling 30s after the code update before the configuration update."
            sleep 30
            aws lambda wait function-updated --function-name "$FUNCTION_NAME" || true
            attempt=1
            while true; do
              if out=$(aws lambda update-function-configuration --function-name "$FUNCTION_NAME" \
                --runtime python3.12 --handler handler.lambda_handler \
                --role "$ROLE_ARN" --memory-size 3008 --timeout 300 \
                --ephemeral-storage Size=10240 \
                --environment "Variables={MODEL_BUCKET=$BUCKET,MODEL_KEY=model/$MODEL_FILE,EMBED_MODEL_KEY=model/$EMBED_MODEL_FILE,SITE_BASE=$DEV_ORIGIN,LLAMA_THREADS=2}" 2>&1); then
                echo "Configuration updated on attempt $attempt."
                break
              fi
              echo "$out"
              if ! echo "$out" | grep -q ResourceConflictException; then
                echo "::error::update-function-configuration failed with a non-retryable error (shown above)."
                exit 1
              fi
              if [ "$attempt" -ge 12 ]; then
                echo "::error::update-function-configuration still conflicting after $attempt attempts."
                exit 1
              fi
              echo "ResourceConflictException: an update is still in progress; retrying in 20s (attempt $((attempt+1)) of 12)."
              attempt=$((attempt+1))
              sleep 20
            done
            aws lambda wait function-updated --function-name "$FUNCTION_NAME" || true
          else
            aws lambda create-function --function-name "$FUNCTION_NAME" \
              --runtime python3.12 --handler handler.lambda_handler \
              --role "$ROLE_ARN" --memory-size 3008 --timeout 300 \
              --ephemeral-storage Size=10240 \
              --environment "Variables={MODEL_BUCKET=$BUCKET,MODEL_KEY=model/$MODEL_FILE,EMBED_MODEL_KEY=model/$EMBED_MODEL_FILE,SITE_BASE=$DEV_ORIGIN,LLAMA_THREADS=2}" \
              --code "S3Bucket=$BUCKET,S3Key=deploy/helper-fn.zip" >/dev/null
            echo "Function created."
          fi
          aws lambda wait function-active --function-name "$FUNCTION_NAME" || true

      - name: Cap reserved concurrency at 5 (cost guard)
        run: |
          set -euo pipefail
          aws lambda put-function-concurrency --function-name "$FUNCTION_NAME" \
            --reserved-concurrent-executions 5 || echo "::warning::reserved concurrency cap skipped (account quota)"
          echo "Reserved concurrency capped at 5."

      - name: Create or update the Function URL (dev origin CORS only)
        run: |
          set -euo pipefail
          CORS="AllowOrigins=[$DEV_ORIGIN],AllowMethods=[POST],AllowHeaders=[content-type],MaxAge=86400"
          if aws lambda get-function-url-config --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            aws lambda update-function-url-config --function-name "$FUNCTION_NAME" \
              --auth-type NONE --cors "$CORS" >/dev/null
            echo "Function URL updated."
          else
            attempt=1
            while true; do
              if out=$(aws lambda create-function-url-config --function-name "$FUNCTION_NAME" \
                --auth-type NONE --cors "$CORS" 2>&1); then
                echo "Function URL created on attempt $attempt."
                break
              fi
              echo "$out"
              if echo "$out" | grep -q FunctionUrlConfigExists; then
                echo "Function URL config already exists; fetching and using it."
                break
              fi
              if ! echo "$out" | grep -q ResourceConflictException; then
                echo "::error::create-function-url-config failed with a non-retryable error (shown above)."
                exit 1
              fi
              if [ "$attempt" -ge 12 ]; then
                echo "::error::create-function-url-config still conflicting after $attempt attempts."
                exit 1
              fi
              echo "ResourceConflictException: retrying in 20s (attempt $((attempt+1)) of 12)."
              attempt=$((attempt+1))
              sleep 20
            done
          fi
          aws lambda add-permission --function-name "$FUNCTION_NAME" \
            --statement-id FunctionURLAllowPublic \
            --action lambda:InvokeFunctionUrl \
            --principal '*' \
            --function-url-auth-type NONE 2>&1 || echo "add-permission: already present or noted above"
          aws lambda add-permission --function-name "$FUNCTION_NAME" \
            --statement-id FunctionURLAllowPublicInvoke \
            --action lambda:InvokeFunction \
            --principal '*' 2>&1 || echo "add-permission (InvokeFunction): already present or noted above"
          URL=$(aws lambda get-function-url-config --function-name "$FUNCTION_NAME" --query 'FunctionUrl' --output text)
          echo "FUNCTION_URL=$URL" >> "$GITHUB_ENV"
          echo "Function URL: $URL"

      - name: Smoke test the endpoint (cold + warm)
        run: |
          set -euo pipefail
          PAYLOAD='{"question":"Where is the hydrograph for Dallas?","context":[{"title":"Dallas - Hydrograph panel","text":"The Hydrograph panel on the Dallas station classic page (Data view) shows observed and modelled river discharge over time.","page":"stations/USGS-08057000.html"}]}'
          echo "--- cold call ---"
          time curl -s --max-time 300 -X POST "$FUNCTION_URL" -H 'Content-Type: application/json' -d "$PAYLOAD"
          echo
          echo "--- warm call ---"
          time curl -s --max-time 300 -X POST "$FUNCTION_URL" -H 'Content-Type: application/json' -d "$PAYLOAD"
          echo
          echo "--- hybrid rerank call (informational: order appears once helper/ht-emb.bin is live on the dev site) ---"
          PAYLOAD2='{"question":"the river out west in the Golden State","context":[{"title":"Columbia River at The Dalles, OR (USGS 14105700) — 3D view","text":"Interactive 3D digital twin for Columbia River at The Dalles, OR.","page":"stations/USGS-14105700-3d.html"}],"candidates":[{"id":"station-14105700-3d","score":31},{"id":"panel-14105700-hts-sec-charts3d","score":24}],"debug":true}'
          curl -s --max-time 300 -X POST "$FUNCTION_URL" -H 'Content-Type: application/json' -d "$PAYLOAD2" || true
          echo
