<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HydroTwin · Sign in</title>
<style>
html,body{margin:0;min-height:100%;background:#0E1A24;font-family:Arial,sans-serif;color:#E6EDF5}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.card{width:min(360px,92vw);padding:22px 24px;border-radius:10px;background:rgba(12,18,28,.9);border:1px solid rgba(143,193,242,.25);box-shadow:0 4px 18px rgba(0,0,0,.5)}
h1{color:#fff;font-size:21px;margin:0 0 4px}
.sub{color:#9FB3C8;font-size:13.5px;line-height:1.5;margin:0 0 16px}
label{display:block;font-size:13px;color:#BFD9F5;margin:12px 0 5px}
input{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;border:1px solid rgba(143,193,242,.4);background:#0E1A24;color:#E6EDF5;font:14px Arial,sans-serif}
input:focus{outline:2px solid #8FC1F2;outline-offset:0;border-color:#8FC1F2}
button{width:100%;margin-top:18px;padding:11px 14px;border-radius:9px;border:1px solid #8FC1F2;background:rgba(12,18,28,.92);color:#8FC1F2;font:600 15px Arial,sans-serif;cursor:pointer}
button:hover{background:rgba(140,190,240,.15);color:#fff}
.err{display:none;margin-top:14px;padding:9px 12px;border-radius:8px;background:rgba(214,69,69,.15);border:1px solid rgba(214,69,69,.55);color:#ffb3b3;font-size:13.5px;line-height:1.4}
.note{color:#9FB3C8;font-size:12px;line-height:1.5;margin:16px 0 0}
</style>
<script>
// Already signed in this session? Go straight to the site.
try {
  if (sessionStorage.getItem('ht_auth') === '1') {
    location.replace('index.html');
  }
} catch (e) {}
</script>
</head><body>
<main>
 <form class="card" id="ht-login-form" autocomplete="off">
  <h1>HydroTwin</h1>
  <p class="sub">Development site &mdash; please sign in to continue.</p>
  <label for="ht-login-user">Username</label>
  <input id="ht-login-user" name="username" type="text" required autofocus>
  <label for="ht-login-pass">Password</label>
  <input id="ht-login-pass" name="password" type="password" required>
  <button type="submit">Sign in</button>
  <p class="err" id="ht-login-err" role="alert">Incorrect username or password. Please try again.</p>
  <p class="note">This sign-in is a simple gate for the development site, not a security boundary.</p>
 </form>
</main>
<noscript><p style="text-align:center;color:#ffb3b3">JavaScript is required to sign in.</p></noscript>
<script>
document.getElementById('ht-login-form').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var u = document.getElementById('ht-login-user').value;
  var p = document.getElementById('ht-login-pass').value;
  if (u === 'admin' && p === 'admin') {
    try { sessionStorage.setItem('ht_auth', '1'); } catch (e) {}
    location.replace('index.html');
  } else {
    document.getElementById('ht-login-err').style.display = 'block';
    document.getElementById('ht-login-pass').value = '';
    document.getElementById('ht-login-pass').focus();
  }
});
</script>
</body></html>
